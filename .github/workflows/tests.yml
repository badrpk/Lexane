name: Lexane tests

on:
  push:
    branches: [main]
    paths:
      - 'lexane.py'
      - 'test_lexane.py'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'lexane.py'
      - 'test_lexane.py'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Lexane language-kernel tests
        run: python -m unittest test_lexane -v
